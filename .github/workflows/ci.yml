name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: docker compose up -d --wait

      - name: Verify shard registration
        run: |
          curl --fail http://localhost:8000/shards

      - name: Test CRUD
        run: |
          set -e

          curl --fail -X POST http://localhost:8000/tables \
            -H "Content-Type: application/json" \
            -d '{"name":"products","partitionKey":"productId"}'

          curl --fail -X POST http://localhost:8000/tables/products/records \
            -H "Content-Type: application/json" \
            -d '{"key":"product_101","value":{"name":"Laptop"}}'

          curl --fail http://localhost:8000/tables/products/records/product_101

      - name: Stop services
        if: always()
        run: docker compose down