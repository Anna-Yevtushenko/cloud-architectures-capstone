name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: docker compose up -d --wait

      - name: Wait for shard registration
        run: |
          set -e

          for i in $(seq 1 30); do
            RESPONSE=$(curl -fsS http://localhost:8000/shards || true)

            if echo "$RESPONSE" | grep -q '"shard-1"' && \
               echo "$RESPONSE" | grep -q '"shard-2"'; then
              echo "Both shards registered successfully"
              exit 0
            fi

            echo "Waiting for shards... attempt $i/30"
            sleep 2
          done

          echo "Shard registration timeout"
          docker compose logs
          exit 1

      - name: Test CRUD
        run: |
          set -e

          curl --fail -X POST http://localhost:8000/tables \
            -H "Content-Type: application/json" \
            -d '{"name":"products","partitionKey":"productId"}'

          curl --fail -X POST http://localhost:8000/tables/products/records \
            -H "Content-Type: application/json" \
            -d '{"key":"product_101","value":{"name":"Laptop"}}'

          curl --fail http://localhost:8000/tables/products/records/product_101

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down